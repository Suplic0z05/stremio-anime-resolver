# CI di stremio-anime-resolver.
#
# NOTA su due scelte che sembrano omissioni e sono deliberate:
#
# 1. NON c'e' uno step `npm install` / `npm ci`. Il progetto dichiara
#    `dependencies: {}` e non ha un package-lock.json, quindi `npm ci` esce con
#    "can only install with an existing package-lock.json". Una CI che installa
#    zero pacchetti non prova niente e aggiunge solo un modo di fallire. Se in
#    futuro compare una dipendenza vera, qui si aggiunge l'install e si mette su
#    il lockfile.
#
# 2. I test live (SAR_LIVE=1) NON girano su push ne' su pull_request. Colpiscono
#    siti di terzi, sono lenti e falliscono per motivi che non c'entrano col
#    codice. Girano solo su richiesta manuale, con l'input `live: true`, cosi'
#    il green della PR resta un segnale del repository e non dello stato di
#    animeworld / animesaturn / animeunity in quel momento.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Esegui anche i test live (SAR_LIVE=1) contro i siti di terzi"
        type: boolean
        default: false

# Un run precedente sullo stesso branch che venga superato non ha piu' valore:
# non sprecare minuti su una CI vecchia.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: syntax + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Coerente con `engines.node: >=20` in package.json. Il minimo e' il
        # contratto, gli altri due sono dove i futuri utenti installeranno
        # davvero Node, e `Array.prototype` / fetch cambiano comportamento.
        #
        # La matrice resta perche' il contratto e' >=20: qui e' successo che node
        # 20 e 22 dessero 0 fallimenti ma decine di `# cancelled`, cioe' una suite
        # che non verificava niente, mentre node 24 era verde. Il confine del
        # keep-alive e' proprio node 24 (da li' in poi la pipe IPC del runner e'
        # ref'd e tiene il loop per caso), quindi la matrice NON puo' essere
        # ridotta a 24: li' il bug non si vede.
        #
        # Nota sul selettore: `node --test test/` (una directory nuda come
        # selettore) e' MODULE_NOT_FOUND da node 22 in poi, quindi su 22 e 24 la
        # job non eseguiva un solo test e lo riportava come 1 fallimento. Per questo
        # `npm test` e' `node --test` puro: la discovery trova gli stessi file su
        # 20/22/24/26. Un glob quotato come `test/**/*.test.mjs` e' peggio: su node 20
        # e' un no-op silenzioso.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Sintassi di ogni file in src/ e test/
        run: npm run check

      - name: Suite offline
        # `--test-reporter=tap` e' obbligatorio, non cosmetico: senza, node >= 24
        # stampa il reporter "spec" (con `✖` e riassunto a colori) mentre node 20/22
        # stampano TAP, quindi lo STESSO fallimento si legge come "# fail 1" su 20/22
        # e come "0 not ok" su 24. Il TAP e' l'unico formato identico sulle quattro
        # versioni della matrice, quindi e' l'unico su cui si puo' fare un gate.
        #
        # Il gate di questa CI non guarda il solo exit code: questa classe di bug
        # (promise appesa + loop che drena) si manifesta come CANCELLAMENTI con
        # `# fail 0`, cioe' una suite "verde" che non ha verificato niente. Le cinque
        # righe di riepilogo vanno lette tutte: tests / pass / fail / cancelled / skipped.
        run: npm test -- --test-reporter=tap

      - name: Suite live (solo su richiesta manuale)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        env:
          SAR_LIVE: '1'
        # Stesso reporter della suite offline: senza, questa job legge i fallimenti
        # con un formato diverso da quello su cui e' scritto il commento sopra.
        run: npm test -- --test-reporter=tap

  docker:
    name: build immagine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nessun setup-node: l'immagine porta gia' Node e non usa dipendenze.
      - name: docker build
        run: docker build -t stremio-anime-resolver:ci .

      - name: Il container parte e /health risponde
        run: |
          set -euo pipefail
          docker run -d --name sar-ci -p 7000:7000 stremio-anime-resolver:ci

          # Attesa esplicita invece di `sleep` fisso: il probe gira finche'
          # il server non risponde, e fallisce con un messaggio che dice cosa
          # non tornava invece di lasciare un timeout muto.
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:7000/health 2>/dev/null); then
              echo "health ok: $body"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::il container non ha risposto su /health in 30 tentativi"
              docker logs sar-ci
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:7000/manifest.json > /dev/null
          echo "manifest ok"

      - name: log del container
        if: failure()
        run: docker logs sar-ci

      - name: cleanup
        if: always()
        run: docker rm -f sar-ci